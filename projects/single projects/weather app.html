<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App Example</title>
  <style>
    body {
      background: #e0f7fa;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .weather-app {
      max-width: 350px;
      margin: 60px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px 24px;
      text-align: center;
    }
    .weather-app__header {
      font-size: 2rem;
      color: #039be5;
      margin-bottom: 16px;
      font-weight: bold;
    }
    .weather-app__location {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 8px;
    }
    .weather-app__icon {
      width: 80px;
      height: 80px;
      margin: 16px auto;
      display: block;
    }
    .weather-app__temp {
      font-size: 2.5rem;
      color: #ff9800;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .weather-app__desc {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 20px;
    }
    .weather-app__details {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      color: #333;
      margin-top: 16px;
    }
    .weather-app__details span {
      flex: 1;
      text-align: center;
    }
    .weather-app__details span:not(:last-child) {
      border-right: 1px solid #eee;
    }
    .weather-app__input {
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .weather-app__input input {
      padding: 6px 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .weather-app__input button {
      padding: 6px 14px;
      font-size: 1rem;
      background: #039be5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .weather-app__input button:hover {
      background: #0277bd;
    }
  </style>
</head>
<body>
  <div class="weather-app">
    <div class="weather-app__header">Weather App</div>
    <form class="weather-app__input" id="weatherForm">
      <input type="text" id="cityInput" placeholder="Enter city" required>
      <button type="submit">Search</button>
    </form>
    <div class="weather-app__location" id="location">Nairobi, Kenya</div>
    <img class="weather-app__icon" id="icon" src="https://openweathermap.org/img/wn/01d.png" alt="Clear Sky">
    <div class="weather-app__temp" id="temp">27°C</div>
    <div class="weather-app__desc" id="desc">Clear Sky</div>
    <div class="weather-app__details">
      <span id="humidity">Humidity: 40%</span>
      <span id="wind">Wind: 12 km/h</span>
      <span id="pressure">Pressure: 1012 hPa</span>
    </div>
  </div>
  <script>
    // Simple weather fetch using OpenWeatherMap API (replace 'YOUR_API_KEY' with a real key for live data)
    const apiKey = 'YOUR_API_KEY'; // <-- Replace with your OpenWeatherMap API key
    const form = document.getElementById('weatherForm');
    const cityInput = document.getElementById('cityInput');
    const locationDiv = document.getElementById('location');
    const iconImg = document.getElementById('icon');
    const tempDiv = document.getElementById('temp');
    const descDiv = document.getElementById('desc');
    const humiditySpan = document.getElementById('humidity');
    const windSpan = document.getElementById('wind');
    const pressureSpan = document.getElementById('pressure');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const city = cityInput.value.trim();
      if (!city) return;
      fetchWeather(city);
    });

    function fetchWeather(city) {
      // For demo, fallback to Nairobi if no API key
      if (apiKey === 'YOUR_API_KEY') {
        locationDiv.textContent = 'Nairobi, Kenya';
        iconImg.src = 'https://openweathermap.org/img/wn/01d.png';
        iconImg.alt = 'Clear Sky';
        tempDiv.textContent = '27°C';
        descDiv.textContent = 'Clear Sky';
        humiditySpan.textContent = 'Humidity: 40%';
        windSpan.textContent = 'Wind: 12 km/h';
        pressureSpan.textContent = 'Pressure: 1012 hPa';
        return;
      }
      fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`)
        .then(res => res.json())
        .then(data => {
          if (data.cod !== 200) {
            alert('City not found!');
            return;
          }
          locationDiv.textContent = `${data.name}, ${data.sys.country}`;
          iconImg.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}.png`;
          iconImg.alt = data.weather[0].description;
          tempDiv.textContent = `${Math.round(data.main.temp)}°C`;
          descDiv.textContent = data.weather[0].description.replace(/\b\w/g, l => l.toUpperCase());
          humiditySpan.textContent = `Humidity: ${data.main.humidity}%`;
          windSpan.textContent = `Wind: ${Math.round(data.wind.speed * 3.6)} km/h`;
          pressureSpan.textContent = `Pressure: ${data.main.pressure} hPa`;
        })
        .catch(() => {
          alert('Failed to fetch weather data.');
        });
    }
