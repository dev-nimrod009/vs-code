<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing</title>
    <link rel="stylesheet" href="landing.css">
     
</head>
<body>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Explore the Hidden Wonders of Kenya</h1>
        <p>Find your next adventure today</p>
        <button class="cta-btn">Find Your Adventure</button>
    </div>

    <!-- Search/Filter Section -->
    <form class="search-filter">
        <select name="activity">
            <option value="">Activity Type</option>
            <option>Hiking</option>
            <option>Kayaking</option>
            <option>Climbing</option>
            <option>Safari</option>
        </select>
        <input type="text" name="location" placeholder="Location">
        <select name="duration">
            <option value="">Duration</option>
            <option>1 day</option>
            <option>2-3 days</option>
            <option>1 week+</option>
        </select>
        <select name="difficulty">
            <option value="">Difficulty</option>
            <option>Easy</option>
            <option>Moderate</option>
            <option>Challenging</option>
        </select>
        <button type="submit">Search</button>
    </form>

    <!-- Featured Adventures (your existing cards) -->
    <div class="homepage">
        <div class="cards">
            <!-- ...existing code for adventure cards... -->
        </div>
    </div>

    <!-- Newsletter Signup -->
    <div class="newsletter">
        <h2>Subscribe to our Newsletter</h2>
        <p>Get the latest adventures and offers straight to your inbox.</p>
        <form>
            <input type="email" placeholder="Your email address" required>
            <button type="submit">Subscribe</button>
        </form>
    </div>

</body>
</html>
